<html><head>
    <title>Transform-rotate()</title> 
    <meta charset="utf-8">
    <style> 
              div#rotate01 {
            width: 150px;             
            height: 80px;             
            background-color:darkblue;  
            transform: rotate(-15deg);
        }

       
        div#rotate02 {
            width: 150px;
            height: 80px;
            background-color:yellow;  
            transform: rotate(30deg);  
        }
    </style>
</head>
<body>
    <h1>Transform - rotate()</h1>

    <div id="rotate01">rotate(-15deg)</div><br>
    >
    <div id="rotate02">rotate(30deg)</div><br>


</body></html>
