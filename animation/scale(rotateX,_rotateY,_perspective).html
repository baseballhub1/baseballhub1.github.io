<html><head>
    <title>2D Transform-scale()</title> 
    <meta charset="utf-8">
    <link type="text/css" rel="stylesheet" href="css/color.css">
    <style> 
        div#scaleXY {
            width: 150px;
            height: 80px;
            background-color: yellow;        
            transform: scale(1.0, 1.0);     
        }
        div#scaleX {
            width: 150px;
            height: 80px;
            background-color: pink;        
            transform: scaleX(0.5);         
        }

        /* scaleY(): 세로 크기만 조정 */
        div#scaleY {
            width: 150px;
            height: 80px;
            background-color: red;       
            transform: scaleY(1.5);          
        }
    </style>
</head>
<body>
    <h1>Transform - scale()</h1>

    <div id="scaleXY">scaleXY(1.0, 1.0)</div><br>

    <div id="scaleX">scaleX(0.5)</div><br>

   
    <div id="scaleY">scaleY(1.5)</div>





</body></html>
