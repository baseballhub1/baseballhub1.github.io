<!DOCTYPE html>
<html>
<head>
    <title>CSS 기본 문법</title>
    <meta charset="utf-8">
    <style>
        /* 글로벌 스타일 리셋 및 배경 설정 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 메인 컨테이너 박스 */
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* 타이틀 스타일 */
        h1 {
            font-size: 1.8rem;
            color: #1e3c72;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            position: relative;
        }

        /* 타이틀 하단 포인트 라인 */
        h1::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: #2a5298;
        }

        /* 리스트 스타일 */
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        /* 리스트 아이템 (카드 형태) */
        li {
            margin-bottom: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* 링크 자체를 카드 전체 영역으로 확장 */
        li a {
            display: block;
            text-decoration: none;
            color: #4a5568;
            font-weight: 500;
            padding: 14px 20px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        /* 마우스 호버 효과 (중요!) */
        li:hover {
            transform: translateY(-3px);
        }

        li:hover a {
            color: #ffffff;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-color: transparent;
            box-shadow: 0 5px 15px rgba(42, 82, 152, 0.3);
        }

        /* 리스트의 마지막 아이템 마진 제거 */
        li:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
