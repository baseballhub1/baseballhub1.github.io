<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>float과 clear | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.demo{padding:10px;border:1px solid #91a8c6}.float{float:left;width:95px;height:85px;background:#8dc9ba;margin:0 14px 8px 0;padding:9px}.clear{clear:both;border-top:2px dashed #315bba;padding-top:8px}</style></head><body><header class="hero"><div class="wrap"><h1>float과 clear</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">float은 요소를 왼쪽이나 오른쪽으로 띄워 주위의 텍스트가 감싸게 하며 clear는 떠 있는 요소 옆 배치를 해제합니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><div class="demo"><div class="float">float:left</div>이 텍스트는 왼쪽의 떠 있는 박스를 감싸며 흐릅니다. float은 원래 이미지 주변에 텍스트를 흐르게 하는 용도로 유용합니다.<p class="clear">clear: both 이후 내용은 float 아래에서 시작합니다.</p></div></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a> · <a href="https://developer.mozilla.org/ko/docs/Web/CSS" target="_blank" rel="noopener noreferrer">MDN CSS 문서</a></p></main><script>document.querySelector('#source').textContent=".demo{padding:10px;border:1px solid #91a8c6}.float{float:left;width:95px;height:85px;background:#8dc9ba;margin:0 14px 8px 0;padding:9px}.clear{clear:both;border-top:2px dashed #315bba;padding-top:8px}";</script></body></html>
