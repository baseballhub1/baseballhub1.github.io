<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>overflow | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.demo{width:260px;height:85px;overflow:auto;border:2px solid #315bba;padding:12px;background:#e7f1ff}</style></head><body><header class="hero"><div class="wrap"><h1>overflow</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">콘텐츠가 요소의 크기를 넘칠 때 visible, hidden, scroll, auto로 처리할 수 있습니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><div class="demo">내용이 영역을 넘어가면 스크롤할 수 있습니다. overflow: auto는 필요할 때만 스크롤바를 생성합니다. 텍스트를 계속 추가하면 상자 영역에 다 담기지 않습니다. 스크롤로 남은 내용을 확인하세요.</div></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a> · <a href="https://developer.mozilla.org/ko/docs/Web/CSS" target="_blank" rel="noopener noreferrer">MDN CSS 문서</a></p></main><script>document.querySelector('#source').textContent=".demo{width:260px;height:85px;overflow:auto;border:2px solid #315bba;padding:12px;background:#e7f1ff}";</script></body></html>
