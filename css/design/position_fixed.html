<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>position: fixed | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.demo{position:fixed;right:18px;bottom:18px;background:#16634c;color:white;border-radius:25px;padding:11px 16px;z-index:10}</style></head><body><header class="hero"><div class="wrap"><h1>position: fixed</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">뷰포트를 기준으로 배치됩니다. 스크롤해도 일반적으로 화면의 같은 위치에 남습니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><p>이 페이지를 스크롤하면 오른쪽 아래의 녹색 배지가 고정되어 보입니다.</p><div class="demo">fixed 배지</div></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a></p></main><script>document.querySelector('#source').textContent=".demo{position:fixed;right:18px;bottom:18px;background:#16634c;color:white;border-radius:25px;padding:11px 16px;z-index:10}";</script></body></html>
