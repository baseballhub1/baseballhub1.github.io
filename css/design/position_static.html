<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>position: static | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.demo{position:static;top:50px;left:40px;background:#c4ead9;padding:18px}</style></head><body><header class="hero"><div class="wrap"><h1>position: static</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">기본 배치 방식입니다. top, left 같은 위치 지정 속성은 static 요소에 영향을 주지 않습니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><div class="demo">static: 문서의 일반 흐름에 따라 위치합니다.</div></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a></p></main><script>document.querySelector('#source').textContent=".demo{position:static;top:50px;left:40px;background:#c4ead9;padding:18px}";</script></body></html>
