<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>position: sticky | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.stage{height:195px;overflow:auto;border:2px solid #6985b9}.demo{position:sticky;top:0;background:#b7f0d9;padding:12px}.filler{height:350px;background:linear-gradient(#fff,#dcecff);padding:16px}</style></head><body><header class="hero"><div class="wrap"><h1>position: sticky</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">스크롤 위치가 지정된 임계값에 도달하면 지정된 스크롤 컨테이너 안에서 붙어 있는 듯 배치됩니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><div class="stage"><div class="demo">sticky: 이 상자 안을 스크롤해 보세요</div><div class="filler">스크롤 가능한 긴 콘텐츠</div></div></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a></p></main><script>document.querySelector('#source').textContent=".stage{height:195px;overflow:auto;border:2px solid #6985b9}.demo{position:sticky;top:0;background:#b7f0d9;padding:12px}.filler{height:350px;background:linear-gradient(#fff,#dcecff);padding:16px}";</script></body></html>
