<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내비게이션 | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.demo{display:flex;gap:8px;flex-wrap:wrap}.demo a{padding:11px 18px;background:#e4eefb;color:#15406c;text-decoration:none;border-radius:7px}.demo a:hover,.demo a:focus-visible{background:#315bba;color:#fff}</style></head><body><header class="hero"><div class="wrap"><h1>내비게이션</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">nav는 주요 페이지 탐색 링크들을 묶는 의미론적 HTML 요소입니다. CSS로 강조 상태와 호버 효과를 지정합니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><nav class="demo" aria-label="예시 메뉴"><a href="#example">홈</a><a href="#example">학습</a><a href="#example">예제</a></nav></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a></p></main><script>document.querySelector('#source').textContent=".demo{display:flex;gap:8px;flex-wrap:wrap}.demo a{padding:11px 18px;background:#e4eefb;color:#15406c;text-decoration:none;border-radius:7px}.demo a:hover,.demo a:focus-visible{background:#315bba;color:#fff}";</script></body></html>
