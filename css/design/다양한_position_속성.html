<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다양한 position 속성 | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.stage{position:relative;border:2px dashed #8497b8;padding:15px;min-height:180px}.item{background:#dceaff;padding:9px;margin:7px}.rel{position:relative;left:20px;background:#c9eedb}.abs{position:absolute;right:10px;top:15px;background:#ffe3ac}.scroll{height:140px;overflow:auto;border:1px solid #aaa}.stick{position:sticky;top:0;background:#f9c3d5}</style></head><body><header class="hero"><div class="wrap"><h1>다양한 position 속성</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">static, relative, absolute, fixed, sticky의 차이를 한 번에 비교합니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><div class="stage"><div class="item">static</div><div class="item rel">relative (오른쪽 20px)</div><div class="item abs">absolute</div></div><div class="scroll"><div class="stick">sticky (내부 스크롤)</div><p style="height:230px;padding:12px">여기를 스크롤해 보세요.</p></div><p>fixed는 별도 예제에서 뷰포트 기준 동작을 확인할 수 있습니다.</p></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a></p></main><script>document.querySelector('#source').textContent=".stage{position:relative;border:2px dashed #8497b8;padding:15px;min-height:180px}.item{background:#dceaff;padding:9px;margin:7px}.rel{position:relative;left:20px;background:#c9eedb}.abs{position:absolute;right:10px;top:15px;background:#ffe3ac}.scroll{height:140px;overflow:auto;border:1px solid #aaa}.stick{position:sticky;top:0;background:#f9c3d5}";</script></body></html>
