<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드롭다운 메뉴 | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.demo{width:230px}.demo summary{cursor:pointer;background:#315bba;color:#fff;padding:12px;border-radius:8px}.demo a{display:block;padding:10px;background:#eaf2fc;text-decoration:none;color:#163a60}</style></head><body><header class="hero"><div class="wrap"><h1>드롭다운 메뉴</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">details와 summary를 이용한 클릭형 드롭다운입니다. 키보드로도 열고 닫을 수 있습니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><details class="demo"><summary>강의 목록 펼치기</summary><a href="#example">HTML 기초</a><a href="#example">CSS 기초</a><a href="#example">JavaScript 기초</a></details></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a></p></main><script>document.querySelector('#source').textContent=".demo{width:230px}.demo summary{cursor:pointer;background:#315bba;color:#fff;padding:12px;border-radius:8px}.demo a{display:block;padding:10px;background:#eaf2fc;text-decoration:none;color:#163a60}";</script></body></html>
