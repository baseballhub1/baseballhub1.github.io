<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수직 내비게이션 | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.demo{display:flex;flex-direction:column;gap:7px;width:190px}.demo a{display:block;background:#dceaff;padding:10px;text-decoration:none;color:#123c68;border-radius:6px}</style></head><body><header class="hero"><div class="wrap"><h1>수직 내비게이션</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">flex-direction: column을 이용하면 메뉴를 세로로 쌓을 수 있습니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><nav class="demo" aria-label="수직 메뉴"><a href="#example">홈</a><a href="#example">서비스</a><a href="#example">소개</a><a href="#example">문의</a></nav></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a> · <a href="https://developer.mozilla.org/ko/docs/Web/CSS" target="_blank" rel="noopener noreferrer">MDN CSS 문서</a></p></main><script>document.querySelector('#source').textContent=".demo{display:flex;flex-direction:column;gap:7px;width:190px}.demo a{display:block;background:#dceaff;padding:10px;text-decoration:none;color:#123c68;border-radius:6px}";</script></body></html>
