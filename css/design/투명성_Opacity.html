<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투명성 (opacity) | CSS Design</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#1a2b42;margin:0}.hero{padding:36px 20px;background:#152e48;color:white}.wrap{max-width:850px;margin:auto;padding:0 16px}main{padding-top:25px;padding-bottom:45px}.card{border-radius:12px;border:1px solid #dae2ed;padding:22px;background:white;margin-bottom:17px}h1{margin:0}h2{margin:0 0 14px}.tip{color:#53627b}pre{background:#122238;color:#b9f7dd;padding:18px;border-radius:9px;white-space:pre-wrap;word-break:break-word}a{color:#126b66}.example{padding:18px;background:#f5faff;border:1px dashed #8ea5bd;border-radius:8px}.samples{display:flex;gap:12px;flex-wrap:wrap}.demo{background:#315bba;color:#fff;padding:20px;border-radius:8px}.a{opacity:1}.b{opacity:.5}.c{opacity:.2}</style></head><body><header class="hero"><div class="wrap"><h1>투명성 (opacity)</h1><p>CSS Design 실습 예제</p></div></header><main class="wrap"><section class="card"><h2>핵심 개념</h2><p class="tip">opacity는 요소 전체와 자식 요소에 적용되는 불투명도이며 0은 투명, 1은 불투명입니다.</p></section><section class="card" id="example"><h2>실행 결과</h2><div class="example"><div class="samples"><div class="demo a">opacity: 1</div><div class="demo b">opacity: 0.5</div><div class="demo c">opacity: 0.2</div></div></div></section><section class="card"><h2>핵심 CSS 코드</h2><pre><code id="source"></code></pre></section><p><a href="../design.html">← CSS Design 목록으로 돌아가기</a> · <a href="https://developer.mozilla.org/ko/docs/Web/CSS" target="_blank" rel="noopener noreferrer">MDN CSS 문서</a></p></main><script>document.querySelector('#source').textContent=".samples{display:flex;gap:12px;flex-wrap:wrap}.demo{background:#315bba;color:#fff;padding:20px;border-radius:8px}.a{opacity:1}.b{opacity:.5}.c{opacity:.2}";</script></body></html>
