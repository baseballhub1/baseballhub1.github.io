<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예제9-9 Math 속성</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#192b40;font:16px/1.65 system-ui,'Malgun Gothic',sans-serif}header{background:#17314e;color:white;padding:36px 20px}header div,main{max-width:850px;margin:auto}h1{margin:0}header p{color:#d6e3f4}main{padding:24px 16px 70px}section{background:white;border:1px solid #dde5ed;border-radius:12px;padding:23px;margin-bottom:18px}button{border:0;background:#116b5a;color:white;border-radius:8px;padding:10px 15px;cursor:pointer}button:disabled{opacity:.55}input{padding:9px;border:1px solid #bac8d4;border-radius:7px;max-width:100%}output,.output{display:block;white-space:pre-wrap;background:#eaf7f2;border-radius:9px;padding:15px;margin-top:14px;font-family:Consolas,monospace}pre{background:#14263d;color:#b9f5dd;padding:16px;border-radius:8px;overflow:auto}code{font-family:Consolas,monospace}a{color:#096e62}</style></head><body><header><div><h1>예제9-9 Math 속성</h1><p>Math 객체의 수학 상수 속성을 확인하는 예제</p></div></header><main><section><h2>Math의 상수</h2><p>Math.PI, Math.E 등의 수학 상수는 함수가 아닌 읽기 전용 속성입니다. 괄호 없이 사용합니다.</p><button id="run">값 다시 보기</button><output id="out"></output></section><section><h2>사용 예시</h2><pre><code>Math.PI
Math.E
Math.SQRT2
Math.SQRT1_2
Math.LN2
Math.LN10
Math.LOG2E
Math.LOG10E</code></pre></section><p><a href="./index.html">← 예제 목록으로 돌아가기</a> · <a href="https://developer.mozilla.org/ko/docs/Web/JavaScript" target="_blank" rel="noopener noreferrer">MDN JavaScript 참고</a></p></main><script>function render(){const a=[["PI (원주율)",Math.PI],["E (자연상수)",Math.E],["SQRT2 (√2)",Math.SQRT2],["SQRT1_2 (√1/2)",Math.SQRT1_2],["LN2 (ln 2)",Math.LN2],["LN10 (ln 10)",Math.LN10],["LOG2E (log₂ e)",Math.LOG2E],["LOG10E (log₁₀ e)",Math.LOG10E]];document.querySelector("#out").textContent=a.map(([k,v])=>k+": "+v).join("\n")}document.querySelector("#run").onclick=render;render();</script></body></html>
