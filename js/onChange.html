<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>과일 선택기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 25px;
        }
        select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background-color: #fff;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus {
            border-color: #4f46e5;
        }
        #result {
            margin-top: 25px;
            font-size: 16px;
            color: #1f2937;
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>과일 선택</h2>
        
        <select id="fruitSelect" onchange="showSelected()">
            <option value="사과">사과</option>
            <option value="바나나">바나나</option>
            <option value="오렌지">오렌지</option>
        </select>

        <div id="result">선택된 과일: <b>사과</b></div>
    </div>

    <script>
        function showSelected() {
            let selectBox = document.getElementById("fruitSelect");
            let selectedValue = selectBox.value;
            
            document.getElementById("result").innerHTML = "선택된 과일: <b>" + selectedValue + "</b>";
        }
    </script>
</body>
</html>
